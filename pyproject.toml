[project]
name = "BOT-RESTO"
version = "0.1.0"
description = "Bot de WhatsApp para pedidos y reservas de restaurantes"
readme = "README.md"
requires-python = ">=3.12"

# SEC-5: versiones exactas. Se actualizan a propósito, nunca por resolución.
dependencies = [
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "sqlalchemy==2.1.2",
    "psycopg[binary]==3.3.6",
    "alembic==1.20.0",
    "httpx==0.28.1",
    "pydantic-settings==2.15.0",
    "pyyaml==6.0.3",
]

[dependency-groups]
dev = [
    "mypy==2.4.0",
    "pytest==9.1.1",
    "ruff==0.16.10",
    "types-pyyaml==6.0.12.20260906",
]

[tool.ruff]
target-version = "py312"
line-length = 88
extend-exclude = [
    # Migraciones generadas por Alembic. Fuera de alcance de
    # add-application-skeleton; se incorporan cuando un change tome backend/alembic/.
    "backend/alembic",
    # Modelos sin pasar por spec. Se levanta cuando pasen a la estructura de
    # dominio (domain/<modulo>/), en el change de dominio.
    "backend/app/models",
]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "S", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101"]

[tool.mypy]
strict = true
files = ["backend/app"]
mypy_path = "backend"
explicit_package_bases = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["backend"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
addopts = "-ra --strict-markers"
markers = [
    "unit: test sin red ni base de datos",
    "integration: test contra PostgreSQL real",
]
